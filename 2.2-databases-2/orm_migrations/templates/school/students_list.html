{% extends "school/base.html" %}
{% load static %}

{% for student in students %}
<div>
    <h3>{{ student.name }}</h3>
    <p>Учителя:</p>
    {% for teacher in student.teachers.all %}
    <p>{{ teacher.name }}: {{ teacher.subject }}</p>
    {% empty %}
    <p>Нет учителей</p>
    {% endfor %}
</div>
{% endfor %}
